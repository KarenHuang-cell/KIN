name: Deploy 2026/ to Bluehost

# DISABLED 2026-09-16: site migrated to Webflow. Bluehost is no longer live.
# Manual trigger only — no auto-deploy on push. Do not re-enable unless kin.net moves back to Bluehost.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 162.241.244.144
          username: developer@kin.net
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./2026/
          server-dir: /public_html/
          # Real deploy mode. Set to true if you want to test what would upload without transferring.
          dry-run: false
          # Files/folders that should NEVER be uploaded to the live site
          exclude: |
            **/.DS_Store
            **/.git*
            **/.git*/**
            **/Photos/**
            **/backups/**
            **/*.psd
            **/*.af
            **/test.txt
            **/.claude/**
            **/node_modules/**
            **/images_jpg/**
